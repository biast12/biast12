name: Update README

on:
  schedule:
    - cron: "17 4 28 2 *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update age
        env:
          TZ: Europe/Copenhagen
          BIRTHDAY: 20000228
        run: |
          # Subtracting YYYYMMDD dates and dividing by 10000 gives whole years
          age=$(( ($(date +%Y%m%d) - BIRTHDAY) / 10000 ))
          if grep -qE '\bage: [0-9]+' README.md; then
            sed -Ei "s/\bage: [0-9]+/age: $age/" README.md
          else
            echo "::warning::No 'age: N' line in README.md, age not updated"
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "Update README with dynamic age"
            git push
          fi
